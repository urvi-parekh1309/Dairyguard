<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <polygon points="50,6 88,24 88,68 50,94 12,68 12,24" fill="#0E172A" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Outer IoT Signal Ring -->
  <circle cx="50" cy="52" r="30" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Stylized Milk Drop Inside -->
  <path d="M50 28 C50 28 32 50 32 62 C32 72 40 78 50 78 C60 78 68 72 68 62 C68 50 50 28 50 28 Z" fill="url(#dropGrad)"/>

  <!-- Temperature & Purity Wavelet -->
  <path d="M40 64 Q45 60 50 64 T60 64" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Digital Core Pulse -->
  <circle cx="50" cy="50" r="3" fill="#10B981"/>
</svg>
